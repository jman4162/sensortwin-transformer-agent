[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensortwin"
version = "0.1.0"
description = "A reproducible research-style benchmark for multichannel sensor event classification with synthetic physics-inspired data, patch transformers, and an agentic experiment runner."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "John Hodge" }]
keywords = ["time-series", "transformer", "sensors", "benchmark", "synthetic-data"]

# Core deps kept light on purpose (spec §20). Heavier extras gated below.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
# Modeling / training layer (PyTorch + classical baselines).
ml = [
    "torch>=2.1",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
]
# Agentic experiment runner (added in v0.7; optional until then).
agents = [
    "langgraph>=0.2",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.8",
    "types-PyYAML",
]

[project.scripts]
sensortwin-generate = "scripts.generate_synthetic:main"

[tool.setuptools.packages.find]
include = ["sensortwin*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = false
warn_unused_ignores = true
warn_redundant_casts = true

# torch is an optional extra (the ml install); don't require stubs for it in the core typecheck.
[[tool.mypy.overrides]]
module = ["torch.*"]
ignore_missing_imports = true
