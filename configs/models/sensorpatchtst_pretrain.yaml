# Masked-patch pretraining + fine-tuning recipe for SensorPatchTST (spec §11.2 / §16, v0.4).
# Model architecture is shared with configs/models/sensorpatchtst.yaml.
pretrain:
  mask_ratio: 0.4
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.01
  scheduler: cosine_warmup
  warmup_epochs: 5
  batch_size: 64
  epochs: 50
  patience: 8
  augment:
    jitter: 0.03
finetune:
  # Lower LR than from-scratch: the pretrained encoder only needs adapting.
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.01
  label_smoothing: 0.1
  scheduler: cosine_warmup
  warmup_epochs: 2
  batch_size: 64
  epochs: 30
  patience: 8
