name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: lint + format + types. Needs only core + dev tooling — the library
  # type-checks without the ml extra (torch/sklearn/... are optional-import overrides).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (black)
        run: black --check .
      - name: Type check (mypy)
        run: mypy sensortwin scripts

  # Full test gate: installs the ml extra (torch + sklearn + xgboost) so the v0.2
  # baselines, training loop, and metrics tests are actually exercised. Tests still
  # use importorskip, so a core-only environment skips them gracefully.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[ml,dev]"
      - name: Tests (pytest)
        run: pytest
